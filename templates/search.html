<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shot Finder</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a1a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 24px;
      background: #111;
      border-bottom: 1px solid #2a2a2a;
    }
    .header h1 { font-size: 1.1rem; font-weight: 600; color: #fff; white-space: nowrap; }
    .header a  { color: #888; font-size: 0.85rem; text-decoration: none; }
    .header a:hover { color: #ccc; }

    /* ── Search bar ── */
    .search-bar {
      display: flex;
      gap: 8px;
      flex: 1;
    }
    #search-input {
      flex: 1;
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 1rem;
      padding: 8px 14px;
      outline: none;
    }
    #search-input:focus { border-color: #5a8a5a; }

    /* ── Status bar ── */
    .status-bar {
      padding: 8px 24px;
      font-size: 0.8rem;
      color: #666;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid #222;
      min-height: 34px;
    }
    #result-count { color: #999; }

    /* ── Build button ── */
    .btn {
      background: #2a3a2a;
      border: 1px solid #3a5a3a;
      border-radius: 4px;
      color: #8ecf8e;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.8rem;
      padding: 4px 12px;
      white-space: nowrap;
    }
    .btn:hover:not(:disabled) { background: #3a4a3a; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Results ── */
    #results {
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .result-row {
      background: #222;
      border: 1px solid #2e2e2e;
      border-radius: 6px;
      padding: 10px 14px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 16px;
      align-items: start;
    }
    .result-row:hover { border-color: #3a3a3a; cursor: pointer; }
    .result-row.selecting { opacity: 0.6; }
    .result-row.selected { border-color: #4a7a4a; background: #1e2a1e; }
    .result-row.select-error { border-color: #7a3a3a; background: #2a1e1e; }
    .select-status {
      font-size: 0.7rem;
      margin-top: 4px;
    }
    .select-status.ok   { color: #6abf6a; }
    .select-status.err  { color: #cf6e6e; }

    .result-filename {
      font-weight: 600;
      color: #e0e0e0;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .good-take-badge {
      background: #2a3a1a;
      border: 1px solid #4a7a2a;
      border-radius: 3px;
      color: #8ecf4a;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 1px 5px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .result-dir {
      color: #555;
      font-size: 0.75rem;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .result-keywords {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }
    .kw-tag {
      background: #2a2a3a;
      border: 1px solid #3a3a5a;
      border-radius: 3px;
      color: #9898c8;
      cursor: pointer;
      font-size: 0.72rem;
      padding: 1px 6px;
    }
    .kw-tag:hover { background: #3a3a4a; border-color: #5a5a8a; }
    .kw-tag.match { background: #2a3a2a; border-color: #3a5a3a; color: #8ecf8e; }
    .kw-tag.exclude { background: #3a1a1a; border-color: #7a2a2a; color: #cf6e6e; }

    .result-meta {
      color: #555;
      font-size: 0.75rem;
      text-align: right;
      white-space: nowrap;
    }

    .empty-state {
      color: #555;
      padding: 40px 24px;
      text-align: center;
    }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #444;
      border-top-color: #8ecf8e;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #load-more {
      display: none;
      margin: 8px auto 24px;
    }

    /* ── Autocomplete ── */
    .search-bar { position: relative; }
    #ac-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: #222;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      max-height: 240px;
      overflow-y: auto;
      z-index: 100;
    }
    .ac-item {
      cursor: pointer;
      padding: 7px 14px;
      font-size: 0.9rem;
      color: #ccc;
    }
    .ac-item:hover, .ac-item.active { background: #2a3a2a; color: #e0e0e0; }
    .ac-item .ac-match { color: #8ecf8e; }
  </style>
</head>
<body>

<div class="header">
  <h1>Shot Finder</h1>
  <a href="/">← Tagger</a>
  <div class="search-bar">
    <input type="text" id="search-input" placeholder="Search keywords… (e.g. Italy sunset -indoor)" autocomplete="off" spellcheck="false">
    <div id="ac-dropdown"></div>
  </div>
</div>

<div class="status-bar">
  <span id="index-status">Checking index…</span>
  <button class="btn" id="build-btn" disabled>Rebuild index</button>
  <span id="result-count"></span>
  <span id="search-spinner" style="display:none"><span class="spinner"></span></span>
</div>

<div id="results"></div>
<button class="btn" id="load-more">Load more</button>

<script>
  let _currentQuery = '';
  let _currentOffset = 0;
  let _total = 0;
  const LIMIT = 50;

  // ── Index status ──────────────────────────────────────────────────────────

  async function loadStatus() {
    try {
      const res = await fetch('/search/api/status');
      const data = await res.json();
      const el = document.getElementById('index-status');
      const btn = document.getElementById('build-btn');
      if (data.state === 'ready') {
        const d = data.built_at ? new Date(data.built_at).toLocaleString() : '?';
        const proj = data.project_name ? `${data.project_name} · ` : '';
        el.textContent = `${proj}${data.clip_count.toLocaleString()} clips · built ${d}`;
      } else {
        el.textContent = 'Index not built';
      }
      btn.disabled = false;
    } catch (_) {
      document.getElementById('index-status').textContent = 'Could not reach server';
    }
  }

  document.getElementById('build-btn').addEventListener('click', async () => {
    const btn = document.getElementById('build-btn');
    const el  = document.getElementById('index-status');
    btn.disabled = true;
    el.innerHTML = '<span class="spinner"></span> Building index…';
    try {
      const res = await fetch('/search/api/build', { method: 'POST' });
      const data = await res.json();
      if (data.error) {
        el.textContent = 'Error: ' + data.error;
      } else {
        const d = data.built_at ? new Date(data.built_at).toLocaleString() : '?';
        const proj = data.project_name ? `${data.project_name} · ` : '';
        el.textContent = `${proj}${data.clip_count.toLocaleString()} clips · built ${d}`;
      }
    } catch (_) {
      el.textContent = 'Build failed';
    }
    btn.disabled = false;
  });

  // ── Search ────────────────────────────────────────────────────────────────

  // Parse a query string into token objects: {text, excluded}.
  // Supports quoted phrases and -exclusions.
  // e.g. 'Sawyer "rolling hills" -Marc' →
  //   [{text:'Sawyer',excluded:false}, {text:'rolling hills',excluded:false}, {text:'Marc',excluded:true}]
  function parseQueryTokens(q) {
    const tokens = [];
    const re = /(-?)"([^"]+)"|(-?)(\S+)/g;
    let m;
    while ((m = re.exec(q)) !== null) {
      if (m[2] !== undefined) {
        // quoted phrase, possibly prefixed with -
        tokens.push({ text: m[2], excluded: m[1] === '-' });
      } else {
        const raw = m[4];
        const excluded = m[3] === '-' || raw.startsWith('-');
        tokens.push({ text: excluded ? raw.replace(/^-/, '') : raw, excluded });
      }
    }
    return tokens;
  }

  // Serialise a token list back to a query string.
  function serializeTokens(tokens) {
    return tokens.map(t => {
      const prefix = t.excluded ? '-' : '';
      const body = t.text.includes(' ') ? `"${t.text}"` : t.text;
      return prefix + body;
    }).join(' ');
  }

  // ── Autocomplete ──────────────────────────────────────────────────────────

  let _allKeywords = [];
  let _acIndex = -1;

  async function loadKeywords() {
    try {
      const res = await fetch('/search/api/keywords');
      const data = await res.json();
      _allKeywords = data.keywords || [];
    } catch (_) {}
  }

  // Return the token the cursor is currently typing (last token in input).
  function currentTypingToken(val) {
    // Strip trailing space — if user typed a space they finished the token.
    if (val.endsWith(' ')) return '';
    const tokens = val.trim().split(/\s+/);
    const last = tokens[tokens.length - 1] || '';
    // Strip leading - or " for matching purposes; keep track of prefix.
    return last.replace(/^-?"?/, '');
  }

  function acPrefix(val) {
    if (val.endsWith(' ')) return '';
    const tokens = val.trim().split(/\s+/);
    const last = tokens[tokens.length - 1] || '';
    return last.match(/^(-?"?)/)[1];
  }

  function showDropdown(val) {
    const dropdown = document.getElementById('ac-dropdown');
    const fragment = currentTypingToken(val);
    if (!fragment || fragment.length < 1) { hideDropdown(); return; }

    const fragLower = fragment.toLowerCase();
    // Exclude already-completed tokens (all but the one currently being typed).
    const allTokens = parseQueryTokens(val).map(t => t.text.toLowerCase());
    const completedLower = new Set(allTokens.slice(0, -1));

    const matches = _allKeywords.filter(kw =>
      kw.toLowerCase().startsWith(fragLower) && !completedLower.has(kw.toLowerCase())
    ).slice(0, 20);

    if (!matches.length) { hideDropdown(); return; }

    _acIndex = 0;
    dropdown.innerHTML = '';
    matches.forEach((kw, i) => {
      const item = document.createElement('div');
      item.className = 'ac-item' + (i === 0 ? ' active' : '');
      item.dataset.index = i;
      // Bold the matching prefix.
      const highlighted = `<span class="ac-match">${kw.slice(0, fragment.length)}</span>${kw.slice(fragment.length)}`;
      item.innerHTML = highlighted;
      item.addEventListener('mousedown', e => {
        e.preventDefault(); // prevent blur before click
        commitAutocomplete(kw);
      });
      dropdown.appendChild(item);
    });
    dropdown.style.display = 'block';
  }

  function hideDropdown() {
    document.getElementById('ac-dropdown').style.display = 'none';
    _acIndex = -1;
  }

  function commitAutocomplete(kw) {
    const input = document.getElementById('search-input');
    const val = input.value;
    const prefix = acPrefix(val);
    // Replace the last token with the completed keyword (quoted if multi-word).
    const tokens = val.trimEnd().split(/\s+/);
    tokens[tokens.length - 1] = prefix + (kw.includes(' ') ? `"${kw}"` : kw);
    input.value = tokens.join(' ') + ' ';
    hideDropdown();
    input.focus();
    // Don't run search yet — let user keep adding tokens.
  }

  function moveAcSelection(dir) {
    const dropdown = document.getElementById('ac-dropdown');
    const items = dropdown.querySelectorAll('.ac-item');
    if (!items.length) return;
    items[_acIndex]?.classList.remove('active');
    _acIndex = Math.max(-1, Math.min(items.length - 1, _acIndex + dir));
    if (_acIndex >= 0) items[_acIndex].classList.add('active');
  }

  let _debounceTimer = null;

  document.getElementById('search-input').addEventListener('input', e => {
    showDropdown(e.target.value);
    clearTimeout(_debounceTimer);
    _debounceTimer = setTimeout(() => runSearch(e.target.value.trim()), 250);
  });

  document.getElementById('search-input').addEventListener('keydown', e => {
    const dropdown = document.getElementById('ac-dropdown');
    if (dropdown.style.display === 'block') {
      if (e.key === 'ArrowDown') { e.preventDefault(); moveAcSelection(1); return; }
      if (e.key === 'ArrowUp')   { e.preventDefault(); moveAcSelection(-1); return; }
      if (e.key === 'Tab' || e.key === 'Enter') {
        if (_acIndex >= 0) {
          e.preventDefault();
          const active = dropdown.querySelector('.ac-item.active');
          if (active) {
            const kw = _allKeywords.find(k =>
              k.toLowerCase() === (active.textContent || '').toLowerCase()
            ) || active.textContent;
            commitAutocomplete(kw);
            if (e.key === 'Enter') {
              clearTimeout(_debounceTimer);
              runSearch(document.getElementById('search-input').value.trim());
            }
            return;
          }
        }
        hideDropdown();
      }
      if (e.key === 'Escape') { hideDropdown(); return; }
    }
    if (e.key === 'Enter') {
      clearTimeout(_debounceTimer);
      runSearch(e.target.value.trim());
    }
  });

  document.getElementById('search-input').addEventListener('blur', () => {
    setTimeout(hideDropdown, 150);
  });

  async function runSearch(q, append = false) {
    if (!q) {
      document.getElementById('results').innerHTML = '';
      document.getElementById('result-count').textContent = '';
      document.getElementById('load-more').style.display = 'none';
      return;
    }
    if (!append) {
      _currentQuery = q;
      _currentOffset = 0;
      document.getElementById('results').innerHTML = '';
    }

    document.getElementById('search-spinner').style.display = 'inline';
    try {
      const params = new URLSearchParams({ q, limit: LIMIT, offset: _currentOffset });
      const res = await fetch('/search/api/query?' + params);
      const data = await res.json();

      _total = data.total || 0;
      _currentOffset += data.results.length;

      document.getElementById('result-count').textContent =
        _total === 0 ? 'No results' : `${_total.toLocaleString()} clips`;

      renderResults(data.results, q, append);

      const loadMore = document.getElementById('load-more');
      loadMore.style.display = _currentOffset < _total ? 'block' : 'none';
    } catch (_) {
      document.getElementById('result-count').textContent = 'Search error';
    }
    document.getElementById('search-spinner').style.display = 'none';
  }

  document.getElementById('load-more').addEventListener('click', () => {
    runSearch(_currentQuery, true);
  });

  function renderResults(results, query, append) {
    const container = document.getElementById('results');
    const queryTokens = parseQueryTokens(query);

    if (!append && results.length === 0) {
      container.innerHTML = '<div class="empty-state">No clips found.</div>';
      return;
    }

    results.forEach(clip => {
      const row = document.createElement('div');
      row.className = 'result-row';

      // Left column
      const left = document.createElement('div');

      const fname = document.createElement('div');
      fname.className = 'result-filename';
      fname.textContent = clip.file_name;
      if (clip.good_take) {
        const badge = document.createElement('span');
        badge.className = 'good-take-badge';
        badge.textContent = 'Good Take';
        fname.appendChild(badge);
      }
      left.appendChild(fname);

      const dir = document.createElement('div');
      dir.className = 'result-dir';
      dir.textContent = clip.clip_dir;
      left.appendChild(dir);

      const kwRow = document.createElement('div');
      kwRow.className = 'result-keywords';
      clip.keywords.forEach(kw => {
        const kwLower = kw.toLowerCase();
        const matchedToken = queryTokens.find(t => kwLower === t.text.toLowerCase());
        let tagClass = 'kw-tag';
        if (matchedToken) tagClass += matchedToken.excluded ? ' exclude' : ' match';

        const tag = document.createElement('span');
        tag.className = tagClass;
        tag.textContent = kw;
        tag.addEventListener('click', () => {
          const input = document.getElementById('search-input');
          const tokens = parseQueryTokens(input.value);
          const idx = tokens.findIndex(t => t.text.toLowerCase() === kwLower);
          if (idx === -1) {
            // not in query → add as inclusion
            tokens.push({ text: kw, excluded: false });
          } else if (!tokens[idx].excluded) {
            // included → convert to exclusion
            tokens[idx] = { text: kw, excluded: true };
          } else {
            // excluded → remove entirely
            tokens.splice(idx, 1);
          }
          input.value = serializeTokens(tokens);
          runSearch(input.value.trim());
        });
        kwRow.appendChild(tag);
      });
      left.appendChild(kwRow);
      row.appendChild(left);

      // Right column
      const meta = document.createElement('div');
      meta.className = 'result-meta';
      if (clip.date_iso) {
        meta.textContent = clip.date_iso.slice(0, 10);
      }
      row.appendChild(meta);

      // Click row → jump to clip in Resolve
      row.addEventListener('click', e => {
        // Don't trigger if clicking a keyword tag (those have their own handler).
        if (e.target.closest('.kw-tag')) return;
        selectClipInResolve(clip, row);
      });

      container.appendChild(row);
    });
  }

  async function selectClipInResolve(clip, row) {
    row.classList.add('selecting');
    try {
      const res = await fetch('/search/api/select', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ file_name: clip.file_name, clip_dir: clip.clip_dir }),
      });
      const data = await res.json();
      row.classList.remove('selecting');
      if (data.ok) {
        row.classList.add('selected');
        row.classList.remove('select-error');
        showSelectStatus(row, '✓ Selected in Resolve', 'ok');
      } else {
        row.classList.add('select-error');
        row.classList.remove('selected');
        showSelectStatus(row, '✗ ' + (data.error || 'Error'), 'err');
      }
    } catch (_) {
      row.classList.remove('selecting');
      row.classList.add('select-error');
      showSelectStatus(row, '✗ Could not reach server', 'err');
    }
  }

  function showSelectStatus(row, msg, type) {
    let el = row.querySelector('.select-status');
    if (!el) {
      el = document.createElement('div');
      el.className = 'select-status';
      row.querySelector('.result-dir').after(el);
    }
    el.className = 'select-status ' + type;
    el.textContent = msg;
    // Clear previous selection highlight from other rows.
    if (type === 'ok') {
      document.querySelectorAll('.result-row.selected').forEach(r => {
        if (r !== row) { r.classList.remove('selected'); r.querySelector('.select-status')?.remove(); }
      });
    }
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  loadStatus();
  loadKeywords();
</script>
</body>
</html>
